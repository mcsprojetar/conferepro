<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101c2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ConferePro">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>ConferePro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff3;--sf:#fff;--ink:#101c2e;--mut:#5d6b7e;--ln:#d9dee6;--pri:#0b3d91;--nf:#0e7c6b;--rc:#c2570c;--ok:#16794a;--bad:#c0262d;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;padding:env(safe-area-inset-top) 0 0}
button,input,select{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em;flex:1}
header small{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:-2px}
.badge{font-size:12px;padding:4px 9px;border-radius:99px;background:#ffffff1f;white-space:nowrap}
.badge.live{background:#1f9d62}.badge.off{background:#8a5a12}.badge.con{background:#3b5aa8}
.menubtn{background:none;border:0;color:#fff;font-size:24px;line-height:1;padding:4px 8px;cursor:pointer}
#menu{position:absolute;right:10px;top:52px;background:var(--sf);color:var(--ink);border-radius:12px;box-shadow:0 8px 30px #0004;min-width:210px;overflow:hidden;display:none}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:13px 16px;border-bottom:1px solid var(--ln);cursor:pointer}
#menu button:last-child{border:0}
main{flex:1;padding:14px 14px 100px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--pri);font-weight:600}
nav svg{width:22px;height:22px}
.card{background:var(--sf);border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid var(--ln)}
.card h2,.card h3{margin:0 0 10px;font-size:17px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:12px;border:1.5px solid var(--ln);border-radius:10px;background:#fff;font-size:16px}
input:focus{outline:none;border-color:var(--pri)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{border:0;border-radius:11px;padding:13px 16px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;width:100%;margin-top:12px}
.btn:disabled{opacity:.4}.btn.sec{background:#e4e9f1;color:var(--ink)}.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;margin:0}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.chip{border:1.5px solid var(--ln);background:var(--sf);border-radius:99px;padding:7px 14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:12px}
.kpi span{font-size:12px;color:var(--mut)}.kpi b{display:block;font-size:21px;margin-top:2px;letter-spacing:-.02em}
.kpi.hero{grid-column:1/-1;background:var(--ink);color:#fff}.kpi.hero span{color:#ffffffb0}.kpi.hero b{font-size:32px}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--ln);margin:8px 0}
.bar i{display:block;height:100%;transition:width .25s}.bar .a{background:var(--nf)}.bar .b{background:var(--rc)}
.leg{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.nfc{color:var(--nf)}.rcc{color:var(--rc)}
.stat{font-size:14px;font-weight:600;padding:8px 10px;border-radius:9px;margin-top:8px;background:#eef1f6}
.stat.ok{background:#e1f4ea;color:var(--ok)}.stat.bad{background:#fbe5e6;color:var(--bad)}
.calc{display:flex;justify-content:space-between;font-size:14px;background:#eef1f6;border-radius:9px;padding:9px 11px;margin-top:10px}
.it{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ln);font-size:15px}
.it:first-of-type{border-top:0}
.it small{display:block;color:var(--mut);font-size:13px}
.q{font-weight:700;white-space:nowrap;text-align:right}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lk{background:none;border:0;color:var(--pri);font-weight:600;cursor:pointer;padding:4px 2px}.lk.bad{color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.ntop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ntop b{font-size:17px}.ntop span{color:var(--mut);font-size:13px}
#modal{position:fixed;inset:0;background:#0008;z-index:50;display:none;align-items:flex-end;justify-content:center}
#modal .box{background:var(--sf);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#modal h3{margin:0 0 6px;font-size:19px}
textarea{width:100%;min-height:260px;border:1.5px solid var(--ln);border-radius:10px;padding:10px;font:14px/1.45 ui-monospace,Menlo,monospace}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.login h1{font-size:40px;letter-spacing:-.04em;margin:0 0 4px;font-weight:800}
.login p{color:var(--mut);margin:0 0 20px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
svg.lucide{width:1em;height:1em}
.pw{position:relative}.pw input{padding-right:84px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--pri);font-weight:600;padding:10px;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ===== Configuração de nuvem (Firebase Firestore) =====
 1) Crie um projeto em console.firebase.google.com, ative "Authentication > Anonymous" e "Firestore".
 2) Cole abaixo o firebaseConfig do seu app web e troque enabled para true.
 3) Regras do Firestore: permita read/write em conferepro/compartilhado para request.auth != null. */
const CLOUD_SYNC_CONFIG={
  enabled:false,
  firebaseConfig:{apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""},
  docPath:"conferepro/compartilhado"
};

/* ===== Utilidades ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const int=v=>Math.max(0,parseInt(v,10)||0);
const todayISO=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmtD=d=>d?d.split('-').reverse().join('/'):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ic=n=>`<i data-lucide="${n}"></i>`;
function icons(){try{window.lucide&&lucide.createIcons()}catch(e){}}
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cp:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'p:'+s}}
function modal(h){const m=$('modal');m.innerHTML=`<div class="box">${h}</div>`;m.style.display='flex';m.onclick=e=>{if(e.target===m)closeModal()};icons()}
function closeModal(){$('modal').style.display='none';$('modal').innerHTML=''}
let confirmFn=null;
function confirmBox(msg,fn,label='Confirmar'){confirmFn=fn;modal(`<h3>Confirmação</h3><p>${msg}</p><button class="btn bad" onclick="const f=confirmFn;closeModal();f&&f()">${label}</button><button class="btn sec" onclick="closeModal()">Cancelar</button>`)}

/* ===== Estado ===== */
const S={
  notes:ls.get('cp_notes',[]),
  draft:ls.get('cp_draft',{step:1,date:todayISO(),supplier:'',items:[]}),
  user:ls.get('cp_sess',null),
  tab:'conferir',period:'7',sync:CLOUD_SYNC_CONFIG.enabled?'con':'local',romDate:todayISO()
};
const isAdmin=()=>S.user&&S.user.role==='admin';
const vis=()=>S.notes.filter(n=>!n.del);
function persist(){ls.set('cp_notes',S.notes);cloudPush()}
function saveDraft(){ls.set('cp_draft',S.draft)}

/* ===== Nuvem ===== */
let fdb=null,docRef=null;
const merge=(a,b)=>{const m=new Map();[...a,...b].forEach(n=>{const o=m.get(n.id);if(!o||(n.u||0)>(o.u||0))m.set(n.id,n)});return[...m.values()]};
function setSync(s){S.sync=navigator.onLine||s==='local'?s:'off';const b=$('sync');if(b){b.className='badge '+({live:'live',off:'off',con:'con'}[S.sync]||'');b.textContent={local:'Local',con:'Conectando...',live:'Ao Vivo',off:'Offline/Local'}[S.sync]}}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function cloudInit(){
  const c=CLOUD_SYNC_CONFIG;
  if(!c.enabled||!c.firebaseConfig.apiKey){S.sync='local';return}
  try{
    const v='10.12.2',b='https://www.gstatic.com/firebasejs/'+v+'/firebase-';
    await loadScript(b+'app-compat.js');await loadScript(b+'auth-compat.js');await loadScript(b+'firestore-compat.js');
    firebase.initializeApp(c.firebaseConfig);
    await firebase.auth().signInAnonymously();
    fdb=firebase.firestore();
    const [col,id]=c.docPath.split('/');docRef=fdb.collection(col).doc(id);
    docRef.onSnapshot(snap=>{
      const remote=snap.exists?(snap.data().notes||[]):[];
      const merged=merge(S.notes,remote);
      const changed=JSON.stringify(merged)!==JSON.stringify(S.notes);
      const needPush=merged.some(n=>{const r=remote.find(x=>x.id===n.id);return!r||(r.u||0)<(n.u||0)});
      if(changed){S.notes=merged;ls.set('cp_notes',S.notes);if(S.user&&!$('modal').style.display.includes('flex'))render()}
      setSync('live');
      if(needPush&&!snap.metadata.hasPendingWrites)cloudPush();
    },()=>setSync('off'));
  }catch(e){console.warn('Sync indisponível',e);setSync('off')}
}
async function cloudPush(){
  if(!docRef)return;
  try{
    await fdb.runTransaction(async tx=>{
      const s=await tx.get(docRef);const remote=s.exists?(s.data().notes||[]):[];
      tx.set(docRef,{notes:merge(S.notes,remote),updated:Date.now()});
    });
  }catch(e){setSync('off')}
}
window.addEventListener('online',()=>setSync(docRef?'live':'local'));
window.addEventListener('offline',()=>setSync('off'));

/* ===== Cálculos ===== */
function tot(notes){
  const t={inv:0,rev:0,items:0,units:0,notes:notes.length,NF:{u:0,inv:0,rev:0,it:0},RC:{u:0,inv:0,rev:0,it:0}};
  notes.forEach(n=>n.items.forEach(i=>{
    t.items++;t.units+=i.qtyTotal;t.inv+=i.buy*i.qtyTotal;t.rev+=i.sell*i.qtyTotal;
    [['NF',i.qtyNF],['RC',i.qtyRC]].forEach(([k,q])=>{if(q>0){t[k].u+=q;t[k].it++;t[k].inv+=i.buy*q;t[k].rev+=i.sell*q}});
  }));
  return t;
}
const pct=(l,r)=>r>0?(l/r*100).toFixed(1).replace('.',',')+'%':'—';

/* ===== Login ===== */
function renderLogin(){
  $('app').innerHTML=`<div class="login" onkeydown="if(event.key==='Enter')doLogin(event)">
  <h1>ConferePro</h1><p>Conferência de mercadorias e divisão entre Nova Fátima e Riachão.</p>
  <label>Usuário ou e-mail</label><input id="lu" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
  <label>Senha</label>${pwField('lp','current-password')}
  <div class="err" id="le"></div><button class="btn" type="button" onclick="doLogin(event)">Entrar</button></div>`;
}
async function doLogin(e){
  e&&e.preventDefault&&e.preventDefault();
  const u=$('lu').value.trim().toLowerCase(),p=$('lp').value.trim();
  if(u==='marcoscintra@live.com'){
    const stored=ls.get('cp_pwd',null),ph=await hash(p),ok=ph===(stored||await hash('alfa1525'));
    if(ok){S.user={role:'admin',name:'Administrador'};S.tab='resumo'}else return $('le').textContent='Usuário ou senha incorretos.';
  }else if(u==='lojasvalentina'&&p==='1010'){S.user={role:'staff',name:'Funcionária'};S.tab='conferir'}
  else return $('le').textContent='Usuário ou senha incorretos.';
  ls.set('cp_sess',S.user);render();
}
function logout(){S.user=null;ls.set('cp_sess',null);render()}

/* ===== Casca do app ===== */
function render(){
  if(!S.user)return renderLogin();
  if(!isAdmin()&&S.tab==='resumo')S.tab='conferir';
  const tabs=[...(isAdmin()?[['resumo','Resumo','layout-dashboard']]:[]),['conferir','Conferir','clipboard-check'],['historico','Histórico','history']];
  $('app').innerHTML=`<header><h1>ConferePro<small>${esc(S.user.name)}</small></h1><span class="badge" id="sync"></span>
  <button class="menubtn" onclick="toggleMenu(event)" aria-label="Menu">⋮</button>
  <div id="menu">${isAdmin()?`<button onclick="pwdModal()">Alterar senha do administrador</button><button onclick="clearData()">Limpar dados</button><button onclick="restoreData()">Restaurar dados</button>`:''}${standalone()?'':'<button onclick="installApp()">Instalar app no celular</button>'}<button onclick="logout()">Bloquear / Sair</button></div></header>
  <main id="main"></main>
  <nav><div>${tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')">${ic(t[2])}<span>${t[1]}</span></button>`).join('')}</div></nav>`;
  setSync(S.sync);
  ({resumo:vResumo,conferir:vConferir,historico:vHistorico})[S.tab]();
  icons();
}
function go(t){S.tab=t;render();scrollTo(0,0)}
function toggleMenu(e){e.stopPropagation();const m=$('menu');m.style.display=m.style.display==='block'?'none':'block'}
document.addEventListener('click',()=>{const m=$('menu');if(m)m.style.display='none'});

/* ===== Resumo ===== */
function vResumo(){
  const days=S.period==='all'?null:+S.period;
  let cut=null;if(days!=null){const d=new Date();d.setDate(d.getDate()-(days===0?0:days-1));cut=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
  const ns=vis().filter(n=>!cut||n.date>=cut),t=tot(ns),lucro=t.rev-t.inv,sum=t.NF.u+t.RC.u||1;
  const store=(k,nm,cl)=>`<div class="card"><h3 class="${cl}">${nm}</h3><div class="kpis" style="margin:0">
   <div class="kpi"><span>Unidades</span><b>${t[k].u}</b></div><div class="kpi"><span>Itens</span><b>${t[k].it}</b></div>
   <div class="kpi"><span>Investido</span><b>${money(t[k].inv)}</b></div><div class="kpi"><span>Lucro bruto</span><b>${money(t[k].rev-t[k].inv)}</b></div></div></div>`;
  $('main').innerHTML=`<div class="chips">${[['0','Hoje'],['7','7 dias'],['30','30 dias'],['all','Tudo']].map(p=>`<button class="chip ${S.period===p[0]?'on':''}" onclick="S.period='${p[0]}';render()">${p[1]}</button>`).join('')}</div>
  <div class="kpis"><div class="kpi hero"><span>Lucro bruto estimado</span><b>${money(lucro)}</b></div>
  <div class="kpi"><span>Total investido</span><b>${money(t.inv)}</b></div><div class="kpi"><span>Venda estimada</span><b>${money(t.rev)}</b></div>
  <div class="kpi"><span>Margem média</span><b>${pct(lucro,t.rev)}</b></div><div class="kpi"><span>Notas · Itens</span><b>${t.notes} · ${t.items}</b></div></div>
  <div class="card"><h3>Divisão das unidades</h3><div class="bar"><i class="a" style="width:${t.NF.u/sum*100}%"></i><i class="b" style="width:${t.RC.u/sum*100}%"></i></div>
  <div class="leg"><span class="nfc">Nova Fátima ${t.NF.u}</span><span class="rcc">Riachão ${t.RC.u}</span></div></div>
  <div class="card"><h3>Por fornecedor</h3>${(()=>{const m={};ns.forEach(n=>{(m[n.supplier]=m[n.supplier]||[]).push(n)});const k=Object.keys(m);return k.length?k.map(s=>{const x=tot(m[s]);return`<div class="it"><div><b>${esc(s)}</b><small>${x.notes} nota(s) · ${x.units} un.</small><small>Compra ${money(x.inv)} · Venda ${money(x.rev)}</small></div><div class="q">${money(x.rev-x.inv)}<small>lucro (${pct(x.rev-x.inv,x.rev)})</small></div></div>`}).join(''):'<div class="empty">Sem notas no período.</div>'})()}</div>
  ${store('NF','Nova Fátima (NF)','nfc')}${store('RC','Riachão (RC)','rcc')}`;
}

/* ===== Campos de item (compartilhado entre Conferir e edição) ===== */
function itemFields(p,it={}){
  return `<label>Produto</label><input id="${p}Prod" value="${esc(it.product||'')}" autocomplete="off">
  <label>Marca</label><input id="${p}Brand" value="${esc(it.brand||'')}" autocomplete="off">
  ${isAdmin()?`<div class="row"><div><label>Compra (R$)</label><input id="${p}Buy" inputmode="decimal" value="${it.buy||''}" oninput="calc('${p}')"></div>
  <div><label>Venda (R$)</label><input id="${p}Sell" inputmode="decimal" value="${it.sell||''}" oninput="calc('${p}')"></div></div>
  <div class="calc"><span>Lucro unit.: <b id="${p}Lu">—</b></span><span>Margem: <b id="${p}Mg">—</b></span></div>`:''}
  <label>Quantidade total</label><input id="${p}Tot" inputmode="numeric" value="${it.qtyTotal||''}" oninput="onTot('${p}')">
  <div class="row"><div><label class="nfc">Nova Fátima (NF)</label><input id="${p}NF" inputmode="numeric" value="${it.qtyNF??''}" oninput="onNF('${p}')"></div>
  <div><label class="rcc">Riachão (RC)</label><input id="${p}RC" inputmode="numeric" value="${it.qtyRC??''}" oninput="onRC('${p}')"></div></div>
  <div class="bar"><i class="a" id="${p}BA"></i><i class="b" id="${p}BB"></i></div><div class="stat" id="${p}St"></div>`;
}
function calc(p){
  if(!isAdmin())return;
  const b=num($(p+'Buy').value),s=num($(p+'Sell').value);
  $(p+'Lu').textContent=s||b?money(s-b):'—';$(p+'Mg').textContent=s?pct(s-b,s):'—';
}
function split(p){
  const t=int($(p+'Tot').value),a=int($(p+'NF').value),b=int($(p+'RC').value),sum=a+b,st=$(p+'St');
  const base=Math.max(t,sum,1);
  $(p+'BA').style.width=a/base*100+'%';$(p+'BB').style.width=b/base*100+'%';
  let ok=false;
  if(!t){st.className='stat';st.textContent='Informe a quantidade total.'}
  else if(sum===t){st.className='stat ok';st.textContent=`Dividido corretamente: ${a} + ${b} = ${t}`;ok=true}
  else if(sum<t){st.className='stat bad';st.textContent=`Faltam ${t-sum} un. para distribuir`}
  else{st.className='stat bad';st.textContent=`Excede o total em ${sum-t} un.`}
  const btn=$(p+'Ok');if(btn)btn.disabled=!(ok&&$(p+'Prod').value.trim());
  return ok;
}
function onTot(p){const t=int($(p+'Tot').value),a=int($(p+'NF').value);$(p+'RC').value=Math.max(t-a,0);split(p)}
function onNF(p){const t=int($(p+'Tot').value),a=int($(p+'NF').value);$(p+'RC').value=Math.max(t-a,0);split(p)}
function onRC(p){const t=int($(p+'Tot').value),b=int($(p+'RC').value);$(p+'NF').value=Math.max(t-b,0);split(p)}
function readItem(p,id,old){
  return{id:id||uid(),product:$(p+'Prod').value.trim(),brand:$(p+'Brand').value.trim(),
    buy:isAdmin()?num($(p+'Buy').value):(old?old.buy:0),sell:isAdmin()?num($(p+'Sell').value):(old?old.sell:0),
    qtyTotal:int($(p+'Tot').value),qtyNF:int($(p+'NF').value),qtyRC:int($(p+'RC').value)};
}
function itemRow(i,extra=''){
  return`<div class="it"><div><b>${esc(i.product)}</b><small>${esc(i.brand||'Sem marca')}</small>
  ${isAdmin()?`<small>Compra ${money(i.buy)} · Venda ${money(i.sell)} · Lucro ${money((i.sell-i.buy)*i.qtyTotal)} (${pct(i.sell-i.buy,i.sell)})</small>`:''}${extra}</div>
  <div class="q">${i.qtyTotal} un.<small><span class="nfc">NF ${i.qtyNF}</span> · <span class="rcc">RC ${i.qtyRC}</span></small></div></div>`;
}

/* ===== Conferir ===== */
function vConferir(){
  const d=S.draft;
  if(d.step===1){
    const sup=[...new Set(vis().map(n=>n.supplier))];
    $('main').innerHTML=`<div class="card"><h2>Dados da nota</h2>
    <label>Data da conferência</label><input id="dDate" type="date" value="${d.date}">
    <label>Fornecedor</label><input id="dSup" list="sups" value="${esc(d.supplier)}" autocomplete="off"><datalist id="sups">${sup.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
    <button class="btn" onclick="startNote()">Continuar para os produtos</button></div>`;
    return;
  }
  $('main').innerHTML=`<div class="card"><div class="ntop"><b>${esc(d.supplier)}</b><span>${fmtD(d.date)}</span></div>
  <div class="acts"><button class="lk" onclick="S.draft.step=1;saveDraft();render()">Alterar data/fornecedor</button></div></div>
  <div class="card"><h3>Novo produto</h3>${itemFields('f')}
  <button class="btn" id="fOk" onclick="addItem()" disabled>Adicionar item</button></div>
  <div class="card"><h3>Itens da nota (${d.items.length})</h3>
  ${d.items.length?d.items.map(i=>itemRow(i,`<div class="acts" style="margin-top:4px"><button class="lk" onclick="editDraft('${i.id}')">Editar</button><button class="lk bad" onclick="rmDraft('${i.id}')">Remover</button></div>`)).join(''):'<div class="empty">Nenhum item lançado ainda.</div>'}
  <button class="btn ok" onclick="finishNote()" ${d.items.length?'':'disabled'}>Concluir e salvar conferência</button></div>`;
  $('fProd').oninput=()=>split('f');split('f');calc('f');
}
function startNote(){
  const date=$('dDate').value,sup=$('dSup').value.trim();
  if(!date||!sup)return toast('Informe a data e o fornecedor');
  Object.assign(S.draft,{date,supplier:sup,step:2});saveDraft();render();
}
function addItem(){
  if(!split('f'))return toast('Confira a divisão entre as lojas');
  S.draft.items.push(readItem('f'));saveDraft();render();toast('Item adicionado');
  setTimeout(()=>$('fProd')&&$('fProd').focus(),50);
}
function editDraft(id){
  const it=S.draft.items.find(x=>x.id===id);
  modal(`<h3>Editar item</h3>${itemFields('m',it)}<button class="btn" id="mOk" onclick="saveDraftItem('${id}')">Salvar item</button><button class="btn sec" onclick="closeModal()">Cancelar</button>`);
  $('mProd').oninput=()=>split('m');split('m');calc('m');
}
function saveDraftItem(id){
  if(!split('m'))return toast('Confira a divisão entre as lojas');
  const k=S.draft.items.findIndex(x=>x.id===id);
  S.draft.items[k]=readItem('m',id,S.draft.items[k]);saveDraft();closeModal();render();toast('Item atualizado');
}
function rmDraft(id){S.draft.items=S.draft.items.filter(i=>i.id!==id);saveDraft();render()}
function finishNote(){
  const d=S.draft;if(!d.items.length)return;
  S.notes.push({id:uid(),date:d.date,supplier:d.supplier,items:d.items,u:Date.now()});
  persist();S.draft={step:1,date:todayISO(),supplier:'',items:[]};saveDraft();
  S.tab='historico';render();toast('Conferência salva');
}

/* ===== Histórico & Romaneios ===== */
function vHistorico(){
  const ns=vis().sort((a,b)=>b.date.localeCompare(a.date)||(b.u||0)-(a.u||0));
  $('main').innerHTML=(isAdmin()?`<div class="card"><h3>Romaneio do dia</h3><input type="date" id="rDay" value="${S.romDate}" onchange="S.romDate=this.value">
  <div class="row"><button class="btn sm nfbtn" style="background:var(--nf);margin-top:10px" onclick="showRom('day',S.romDate,'NF')">Nova Fátima</button>
  <button class="btn sm" style="background:var(--rc);margin-top:10px" onclick="showRom('day',S.romDate,'RC')">Riachão</button></div></div>`:'')+
  (ns.length?ns.map(n=>{
    const t=tot([n]);
    return`<div class="card"><div class="ntop"><b>${esc(n.supplier)}</b><span>${fmtD(n.date)}</span></div>
    <div style="font-size:13px;color:var(--mut);margin:2px 0 6px">${t.items} itens · ${t.units} un. · <span class="nfc">NF ${t.NF.u}</span> · <span class="rcc">RC ${t.RC.u}</span></div>
    ${isAdmin()?`<div class="kpis" style="grid-template-columns:repeat(3,1fr);margin:6px 0 8px"><div class="kpi"><span>Total compra</span><b style="font-size:15px">${money(t.inv)}</b></div><div class="kpi"><span>Total venda</span><b style="font-size:15px">${money(t.rev)}</b></div><div class="kpi"><span>Lucro (${pct(t.rev-t.inv,t.rev)})</span><b style="font-size:15px">${money(t.rev-t.inv)}</b></div></div>`:''}
    ${n.items.map(i=>itemRow(i,`<button class="lk" onclick="editItem('${n.id}','${i.id}')">Editar item</button>`)).join('')}
    <div class="acts"><button class="lk" onclick="editNote('${n.id}')">Editar nota</button>${isAdmin()?`<button class="lk" onclick="showRom('note','${n.id}','NF')">Romaneio NF</button><button class="lk" onclick="showRom('note','${n.id}','RC')">Romaneio RC</button><button class="lk bad" onclick="delNote('${n.id}')">Excluir</button>`:''}</div></div>`}).join(''):'<div class="empty">Nenhuma conferência salva ainda.<br>Use a aba Conferir para começar.</div>');
}
function editNote(id){
  const n=S.notes.find(x=>x.id===id);
  modal(`<h3>Editar nota</h3><label>Data</label><input id="eDate" type="date" value="${n.date}"><label>Fornecedor</label><input id="eSup" value="${esc(n.supplier)}">
  <button class="btn" onclick="saveNote('${id}')">Salvar</button><button class="btn sec" onclick="closeModal()">Cancelar</button>`);
}
function saveNote(id){
  const n=S.notes.find(x=>x.id===id),d=$('eDate').value,s=$('eSup').value.trim();
  if(!d||!s)return toast('Preencha data e fornecedor');
  Object.assign(n,{date:d,supplier:s,u:Date.now()});persist();closeModal();render();toast('Nota atualizada');
}
function editItem(nid,iid){
  const it=S.notes.find(x=>x.id===nid).items.find(x=>x.id===iid);
  modal(`<h3>Editar item</h3>${itemFields('m',it)}<button class="btn" id="mOk" onclick="saveItem('${nid}','${iid}')">Salvar item</button>
  ${isAdmin()?`<button class="btn bad" onclick="delItem('${nid}','${iid}')">Excluir item</button>`:''}<button class="btn sec" onclick="closeModal()">Cancelar</button>`);
  $('mProd').oninput=()=>split('m');split('m');calc('m');
}
function saveItem(nid,iid){
  if(!split('m'))return toast('Confira a divisão entre as lojas');
  const n=S.notes.find(x=>x.id===nid),k=n.items.findIndex(x=>x.id===iid);
  n.items[k]=readItem('m',iid,n.items[k]);n.u=Date.now();persist();closeModal();render();toast('Item atualizado');
}
function delItem(nid,iid){
  confirmBox('Excluir este item da nota?',()=>{
    const n=S.notes.find(x=>x.id===nid);n.items=n.items.filter(x=>x.id!==iid);n.u=Date.now();
    if(!n.items.length)n.del=true;persist();render();toast('Item excluído');
  },'Excluir');
}
function delNote(id){
  confirmBox('Excluir esta nota inteira? Você poderá recuperá-la apenas restaurando os dados.',()=>{
    const n=S.notes.find(x=>x.id===id);n.del=true;n.u=Date.now();persist();render();toast('Nota excluída');
  },'Excluir nota');
}

/* Romaneio */
function romText(notes,store,title){
  const k='qty'+store,nm=store==='NF'?'NOVA FÁTIMA (NF)':'RIACHÃO (RC)';
  let out=`*ROMANEIO ${nm}*\n${title}\n`,total=0,any=false;
  notes.forEach(n=>{
    const its=n.items.filter(i=>i[k]>0);if(!its.length)return;any=true;
    out+=`\n*${n.supplier}* — ${fmtD(n.date)}\n`;
    its.forEach(i=>{out+=`• ${i[k]}x ${i.product}${i.brand?' ('+i.brand+')':''}\n`;total+=i[k]});
  });
  return any?out+`\n*Total: ${total} un.*`:out+'\nNenhum item para esta loja.';
}
function showRom(kind,ref,store){
  const ns=kind==='day'?vis().filter(n=>n.date===ref):vis().filter(n=>n.id===ref);
  if(!ns.length)return toast('Nenhuma nota nesta data');
  const txt=romText(ns,store,kind==='day'?'Consolidado do dia '+fmtD(ref):'Nota de '+ns[0].supplier);
  modal(`<h3>Romaneio ${store==='NF'?'Nova Fátima':'Riachão'}</h3>
  <div class="chips" style="margin:8px 0"><button class="chip ${store==='NF'?'on':''}" onclick="showRom('${kind}','${ref}','NF')">NF</button><button class="chip ${store==='RC'?'on':''}" onclick="showRom('${kind}','${ref}','RC')">RC</button></div>
  <textarea id="romTx" readonly>${esc(txt)}</textarea>
  <button class="btn" onclick="copyRom()">Copiar texto</button>
  <button class="btn ok" onclick="window.open('https://wa.me/?text='+encodeURIComponent($('romTx').value),'_blank')">Enviar no WhatsApp</button>
  <button class="btn sec" onclick="closeModal()">Fechar</button>`);
}
async function copyRom(){
  const t=$('romTx');
  try{await navigator.clipboard.writeText(t.value)}catch(e){t.select();document.execCommand('copy')}
  toast('Romaneio copiado');
}

/* ===== Menu do administrador ===== */
function pwField(id,ac='off'){return`<div class="pw"><input id="${id}" type="password" autocomplete="${ac}" required><button type="button" onclick="togglePw('${id}',this)">Mostrar</button></div>`}
function togglePw(id,b){const i=$(id),show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'Ocultar':'Mostrar'}
function pwdModal(){
  modal(`<h3>Alterar senha do administrador</h3><label>Senha atual</label>${pwField('pc','current-password')}<label>Nova senha (mín. 4 caracteres)</label>${pwField('pn','new-password')}<label>Confirmar nova senha</label>${pwField('pr','new-password')}
  <div class="err" id="pe"></div><button class="btn" onclick="savePwd()">Salvar senha</button><button class="btn sec" onclick="closeModal()">Cancelar</button>`);
}
async function savePwd(){
  const stored=ls.get('cp_pwd',null),cur=await hash($('pc').value);
  if(cur!==(stored||await hash('alfa1525')))return $('pe').textContent='Senha atual incorreta.';
  const n=$('pn').value;
  if(n.length<4)return $('pe').textContent='A nova senha precisa ter ao menos 4 caracteres.';
  if(n!==$('pr').value)return $('pe').textContent='A confirmação não confere.';
  ls.set('cp_pwd',await hash(n));closeModal();toast('Senha alterada');
}
function clearData(){
  confirmBox('Limpar todas as notas? Uma cópia de segurança será guardada para restauração.',()=>{
    ls.set('cp_backup',vis());const now=Date.now();
    S.notes.forEach(n=>{n.del=true;n.u=now});persist();render();toast('Dados limpos');
  },'Limpar dados');
}
function restoreData(){
  const b=ls.get('cp_backup',[]);
  if(!b.length)return toast('Não há cópia para restaurar');
  confirmBox(`Restaurar ${b.length} nota(s) da última limpeza?`,()=>{
    const now=Date.now();b.forEach(n=>{const o=S.notes.find(x=>x.id===n.id);const r={...n,del:false,u:now};o?Object.assign(o,r):S.notes.push(r)});
    persist();render();toast('Dados restaurados');
  },'Restaurar');
}

/* ===== Instalação como app (PWA) ===== */
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function makeIcon(n){
  const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');
  x.fillStyle='#101c2e';x.fillRect(0,0,n,n);
  x.fillStyle='#0e7c6b';x.fillRect(n*.2,n*.58,n*.28,n*.22);x.fillStyle='#c2570c';x.fillRect(n*.52,n*.58,n*.28,n*.22);
  x.fillStyle='#fff';x.font='800 '+n*.3+'px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('CP',n/2,n*.36);
  return c.toDataURL('image/png');
}
function setupPWA(){
  try{
    const i192=makeIcon(192),i512=makeIcon(512),link=document.createElement('link');
    link.rel='apple-touch-icon';link.href=makeIcon(180);document.head.appendChild(link);
    const base=new URL('./',location.href).href;
    const man={name:'ConferePro',short_name:'ConferePro',start_url:base,scope:base,display:'standalone',orientation:'portrait',background_color:'#101c2e',theme_color:'#101c2e',
      icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any'}]};
    const m=document.createElement('link');m.rel='manifest';m.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(m);
  }catch(e){}
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
let installEv=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e});
window.addEventListener('appinstalled',()=>{installEv=null;toast('App instalado')});
async function installApp(){
  if(installEv){installEv.prompt();await installEv.userChoice;installEv=null;return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  modal(`<h3>Instalar o ConferePro</h3>${ios
    ?'<p>No iPhone, abra esta página no <b>Safari</b>, toque no botão <b>Compartilhar</b> (quadrado com seta para cima) e escolha <b>Adicionar à Tela de Início</b>.</p>'
    :'<p>No Android, abra no <b>Chrome</b>, toque no menu <b>⋮</b> (canto superior) e escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</p>'}
  <p style="color:var(--mut);font-size:14px">O ícone aparece na tela inicial e o app abre em tela cheia, como um aplicativo normal.</p><button class="btn" onclick="closeModal()">Entendi</button>`);
}

/* ===== Início ===== */
setupPWA();
render();cloudInit();
</script>
